openapi: 3.0.3
info:
  title: FlatWrite API
  version: 0.3.0
  description: |
    FlatWrite public APIs:

    - **Render** at `https://render.flatwrite.md` — markdown → HTML fragments
    - **Assist** at `https://assist.flatwrite.md` — Morph-powered document AI
      (Reflex → Router → Compact → Fast Models)
    - **Extract** at `https://extract.flatwrite.md` — document files → Markdown
      via in-process WASM conversion

    See also `docs/MORPH-ASSIST.md` and `workers/flatwrite-extract/README.md`.
  contact:
    name: Mahesh Shantaram
    url: https://thecontrarian.in
servers:
  - url: https://render.flatwrite.md
    description: Render production
  - url: https://assist.flatwrite.md
    description: Assist production (Morph)
  - url: https://extract.flatwrite.md
    description: Production (in-process WASM extraction)
tags:
  - name: render
    description: Render markdown into HTML head/body fragments
  - name: assist
    description: AI document assist via Morph
  - name: extract
    description: Convert document files (PDF, DOCX, PPTX, XLSX, CSV, EPUB, etc.) to Markdown
security:
  - ApiKeyAuth: []
paths:
  /render:
    options:
      summary: CORS preflight
      description: |
        Returns the CORS headers required for browser clients to call the
        endpoint. Always returns 204 with no body.
      security: []
      responses:
        '204':
          description: CORS preflight accepted
          headers:
            Access-Control-Allow-Origin:
              schema: { type: string }
            Access-Control-Allow-Methods:
              schema: { type: string }
            Access-Control-Allow-Headers:
              schema: { type: string }
            Access-Control-Max-Age:
              schema: { type: string }
    post:
      summary: Render markdown (or a markdown URL) to HTML fragments
      description: |
        Renders the given markdown (or markdown fetched from `markdownUrl`) into
        `{ head, body }` HTML fragments suitable for direct injection into a
        document. If both `markdown` and `markdownUrl` are provided, `markdown`
        wins and `markdownUrl` is used as the base URL for resolving relative
        links.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkdownRenderRequest'
            examples:
              rawMarkdown:
                summary: Raw markdown
                value:
                  markdown: "# Hello\n\nWorld"
                  framework: spectre
              fromUrl:
                summary: Markdown fetched from a URL
                value:
                  markdownUrl: https://raw.githubusercontent.com/owner/repo/main/README.md
      responses:
        '200':
          description: Rendered HTML fragments
          headers:
            X-RateLimit-Limit:
              schema: { type: integer }
              description: Per-minute request cap for this caller IP
            X-RateLimit-Remaining:
              schema: { type: integer }
              description: Remaining requests in the current window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkdownRenderResponse'
        '400':
          description: Bad request (missing fields, invalid JSON)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid X-Api-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Method not allowed (POST only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Unsupported media type (Worker only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds until the next request is allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Render failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Upstream fetch failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /extract:
    options:
      summary: CORS preflight
      description: |
        Returns the CORS headers required for browser clients to call the
        endpoint with a `multipart/form-data` body. Always returns 204
        with no body.
      security: []
      responses:
        '204':
          description: CORS preflight accepted
          headers:
            Access-Control-Allow-Origin:
              schema: { type: string }
            Access-Control-Allow-Methods:
              schema: { type: string }
            Access-Control-Allow-Headers:
              schema: { type: string }
            Access-Control-Max-Age:
              schema: { type: string }
    post:
      tags: [extract]
      summary: Convert an uploaded document to Markdown
      description: |
        Accepts a single file via `multipart/form-data` and converts it to
        deterministic Markdown in-process in the Cloudflare Worker using
        AnyDoc and pdf-inspector WebAssembly. There is no upstream conversion
        service. Authentication is unchanged: `X-Api-Key` is server-to-server;
        browser clients use `X-Mcp-Token` minted by the extract Worker's
        `/mcp-token` endpoint.

        The public API is document-only: PDF, Word, PowerPoint, Excel, CSV,
        and EPUB inputs are supported. Image files (`.png`, `.jpg`, `.jpeg`,
        `.gif`, `.webp`, `.tiff`, `.tif`) and audio files (`.mp3`, `.wav`,
        `.m4a`, `.ogg`, `.flac`) are rejected with `415 UNSUPPORTED_FILE_TYPE`.
        Browser-interactive image OCR exists in the FlatWrite UI, but this API
        does not OCR images or transcribe audio. Scanned or image-only PDFs
        return `422 NEEDS_OCR`; encrypted files return `422 ENCRYPTED`.

        25 MB hard cap; no LLM calls; no disk writes. Conversion-stage errors
        keep the FastAPI-compatible `{"detail":{"error","code"}}` shape.
        The Worker runs on Cloudflare Workers Free (10 ms nominal CPU per
        request). Typical documents measure roughly 0–20 ms CPU and bursts
        are tolerated, but very large multi-MB documents have measured
        250–350 ms CPU and are best-effort — they may eventually hit
        Cloudflare error 1102.
      security:
        - ApiKeyAuth: []
        - McpTokenAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The document to extract. Must have an allowlisted document extension.
      responses:
        '200':
          description: Extracted Markdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractResponse'
        '400':
          description: Empty file, malformed multipart body, or missing/empty file field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractErrorResponse'
        '401':
          description: Missing or invalid X-Api-Key / X-Mcp-Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Method not allowed (POST only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Payload too large (25 MB cap)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractErrorResponse'
        '415':
          description: Unsupported media type or file type; images and audio are rejected on this API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractErrorResponse'
        '422':
          description: Scanned/image-only PDF (NEEDS_OCR) or encrypted file (ENCRYPTED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractErrorResponse'
        '500':
          description: Conversion failed (CONVERT_FAILED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractErrorResponse'
  /api/import-url:
    post:
      tags: [extract]
      summary: Retired server-side URL import endpoint
      deprecated: true
      description: |
        Retired. Server-side conversion has been split into
        `POST /api/fetch-document` (SSRF-guarded fetch of raw bytes) plus
        browser-local conversion. This endpoint remains only to give old
        clients a machine-readable retirement response.
      security: []
      servers:
        - url: https://flatwrite.md
      responses:
        '410':
          description: Endpoint retired (ENDPOINT_RETIRED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointRetiredResponse'
  /api/fetch-document:
    post:
      tags: [extract]
      summary: Fetch a document URL for browser-local conversion
      description: |
        Fetches a public document URL server-side and returns the raw document
        bytes. The server does not convert the document; the browser (or
        another client) runs the local WASM/OCR conversion pipeline after
        downloading the response.

        The initial URL and every redirect hop are validated against SSRF
        rules: `http`/`https` only, no localhost, and no RFC1918, loopback,
        link-local, CGNAT, IPv6 ULA, multicast, benchmarking, or reserved
        addresses, plus a DNS-rebinding guard. IPv4-transition forms
        (IPv4-mapped, IPv4-compatible, NAT64, 6to4) are not rejected
        outright — instead the embedded IPv4 address is extracted and held
        to the same restrictions, so publicly-routable embeddings pass
        while e.g. NAT64-embedded loopback is refused. Redirects are followed
        manually (maximum 5 hops). The upstream timeout is 60 seconds and the
        downloaded document is capped at 25 MB. Raw upstream error bodies are
        never forwarded.

        This endpoint is rate-limited but unauthenticated: callers never
        present `X-Api-Key` or `X-Mcp-Token` for it.
      security: []
      servers:
        - url: https://flatwrite.md
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FetchDocumentRequest'
            example:
              url: https://example.com/files/report.pdf
      responses:
        '200':
          description: Raw document bytes for client-side conversion
          headers:
            X-Flatwrite-Filename:
              schema: { type: string }
              description: URI-encoded filename inferred from the final URL or upstream Content-Type
            X-Flatwrite-Source-Url:
              schema: { type: string }
              description: Final source URL after redirects
            X-Flatwrite-Source-Content-Type:
              schema: { type: string }
              description: Content-Type reported by the upstream response
            Cache-Control:
              schema: { type: string }
              description: Always `no-store`
            X-RateLimit-Limit:
              schema: { type: integer }
              description: Per-minute request cap for this caller IP
            X-RateLimit-Remaining:
              schema: { type: integer }
              description: Remaining requests in the current window
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid/missing URL, SSRF rejection, invalid redirect target, or filename/type could not be determined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchDocumentErrorResponse'
        '404':
          description: Source URL returned 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchDocumentErrorResponse'
        '405':
          description: Method not allowed (POST only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchDocumentErrorResponse'
        '413':
          description: Request body too large or document exceeds the 25 MB cap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchDocumentErrorResponse'
        '415':
          description: URL points to HTML or an unsupported file extension
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchDocumentErrorResponse'
        '429':
          description: Rate limit exceeded (20 requests per minute per caller IP)
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds until the next request is allowed
            X-RateLimit-Limit:
              schema: { type: integer }
              description: Per-minute request cap for this caller IP
            X-RateLimit-Remaining:
              schema: { type: integer }
              description: Remaining requests in the current window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchDocumentErrorResponse'
        '502':
          description: Upstream fetch failure, non-404 upstream error, redirect failure, or empty document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchDocumentErrorResponse'
        '504':
          description: Upstream fetch timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchDocumentErrorResponse'
  /assist:
    post:
      tags: [assist]
      summary: AI-assist a markdown document (Morph pipeline)
      description: |
        Runs Reflex → Model Router → Compact (optional) → Fast Models and
        returns edited markdown. Selection-aware. Does not persist state.
        Browser clients must use `X-Mcp-Token` from `POST /mcp-token` on
        the assist host; long-lived `X-Api-Key` is server-to-server only.
      servers:
        - url: https://assist.flatwrite.md
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [markdown]
              properties:
                markdown:
                  type: string
                  description: Full document markdown
                mode:
                  type: string
                  enum: [custom, rewrite, shorten, fix_grammar]
                  default: rewrite
                instruction:
                  type: string
                  description: Required when mode is custom
                selection:
                  type: object
                  properties:
                    start: { type: integer, minimum: 0 }
                    end: { type: integer, minimum: 0 }
                    text: { type: string }
                options:
                  type: object
                  properties:
                    tone: { type: string }
                    preserveFrontmatter: { type: boolean, default: true }
                    maxOutputTokens: { type: integer }
            example:
              mode: rewrite
              markdown: "# Draft\n\nTeh quick brown fox."
      responses:
        '200':
          description: Assist result
          content:
            application/json:
              schema:
                type: object
                required: [ok, markdown, piece, scope]
                properties:
                  ok: { type: boolean, enum: [true] }
                  markdown: { type: string }
                  piece: { type: string }
                  scope: { type: string, enum: [selection, document] }
                  explanation: { type: string }
                  model: { type: string }
                  routing:
                    type: object
                    properties:
                      tier: { type: string }
                      difficulty: { type: string }
                      confidence: { type: number, nullable: true }
                      domain: { type: string, nullable: true }
                  compacted: { type: boolean }
                  usage:
                    type: object
                    nullable: true
                  reflex:
                    type: object
        '400':
          description: Validation or reflex block
        '401':
          description: Unauthorized
        '429':
          description: Rate limited
        '502':
          description: Upstream Morph failure
  /mcp-token:
    post:
      tags: [assist, extract]
      summary: Mint short-lived browser token (Assist or Extract)
      description: |
        Browser clients obtain short-lived HMAC tokens here instead of using
        the server-to-server `X-Api-Key`. OpenAPI cannot repeat a path key,
        so this single operation documents both independent minting services:

        - `POST https://assist.flatwrite.md/mcp-token` — mints a token with
          `scope: assist`, accepted by the Assist API.
        - `POST https://extract.flatwrite.md/mcp-token` — mints a token with
          `scope: mcp`, accepted by the Extract API as `X-Mcp-Token`.

        Both validate the request `Origin` against the trusted-origin
        allowlist, rate-limit per caller IP, and return the same response
        contract shown below. Tokens are host-scoped: an assist token is not
        valid for extract and vice versa.
      security: []
      servers:
        - url: https://assist.flatwrite.md
      responses:
        '200':
          description: Token minted
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expiresAt: { type: integer }
                  scope: { type: string, enum: [assist, mcp] }
        '403':
          description: Origin not allowed
  /health:
    get:
      tags: [assist]
      summary: Assist service health
      security: []
      servers:
        - url: https://assist.flatwrite.md
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
    McpTokenAuth:
      type: apiKey
      in: header
      name: X-Mcp-Token
      description: Browser-facing short-lived MCP token minted by the target Worker. Used by browser clients; long-lived X-Api-Key is server-to-server only.
  schemas:
    MarkdownRenderRequest:
      type: object
      anyOf:
        - required: [markdown]
        - required: [markdownUrl]
      properties:
        markdown:
          type: string
          description: Raw markdown content to render. Wins if both are supplied.
        markdownUrl:
          type: string
          format: uri
          description: |
            URL pointing to raw markdown content. The host must be on the
            upstream allowlist (raw.githubusercontent.com, raw.gitlab.com,
            bitbucket.org).
        framework:
          type: string
          description: UI framework token (e.g. spectre, pico, oat, poshui).
        fontFamily:
          type: string
          description: Font family name (e.g. Inter, Merriweather, Lora).
        theme:
          type: string
          description: Theme identifier (e.g. light, dark).
        fontSize:
          type: string
          description: Font size token.
        lineHeight:
          type: string
          description: Line height token.
        uiZoom:
          type: number
          format: float
          description: UI zoom multiplier (1.0 = default).
    MarkdownRenderResponse:
      type: object
      required: [head, body]
      properties:
        head:
          type: string
          description: HTML to inject into <head>.
        body:
          type: string
          description: HTML to inject into <body>.
    ErrorResponse:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
          description: Human-readable error message.
        code:
          type: string
          description: Machine-readable error code.
          enum:
            - MISSING_CONTENT
            - INVALID_JSON
            - INVALID_YAML
            - UNAUTHORIZED
            - METHOD_NOT_ALLOWED
            - PAYLOAD_TOO_LARGE
            - RATE_LIMIT
            - UPSTREAM_FETCH_FAILED
            - UPSTREAM_UNREACHABLE
            - UNSUPPORTED_MEDIA_TYPE
            - UNSUPPORTED_FILE_TYPE
            - MISCONFIGURED
            - RENDER_FAILED
            - EMPTY_FILE
            - BAD_REQUEST
            - ENDPOINT_RETIRED
            - NEEDS_OCR
            - ENCRYPTED
            - CONVERT_FAILED
            - INVALID_TOKEN
            - API_KEY_NOT_ALLOWED_FROM_BROWSER
            - ORIGIN_NOT_ALLOWED
            - NOT_FOUND
        detail:
          type: string
          description: Optional additional context (e.g. upstream error).
        retryAfter:
          type: integer
          format: int32
          nullable: true
          description: Seconds until the next request is allowed (RATE_LIMIT only).
    ExtractErrorResponse:
      description: |
        Extract errors use two wire shapes preserved for compatibility:
        Worker-level validation errors are flat `{error, code}` objects;
        conversion-stage errors are wrapped as `{detail: {error, code}}`.
      oneOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - $ref: '#/components/schemas/ExtractConversionErrorResponse'
    ExtractConversionErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: object
          required: [error, code]
          properties:
            error:
              type: string
              description: Human-readable error message.
            code:
              type: string
              description: Machine-readable conversion error code.
              enum:
                - EMPTY_FILE
                - PAYLOAD_TOO_LARGE
                - UNSUPPORTED_FILE_TYPE
                - ENCRYPTED
                - NEEDS_OCR
                - CONVERT_FAILED
                - BAD_REQUEST
    EndpointRetiredResponse:
      type: object
      required: [ok, code, error]
      properties:
        ok:
          type: boolean
          enum: [false]
        code:
          type: string
          enum: [ENDPOINT_RETIRED]
        error:
          type: string
          description: Human-readable replacement guidance.
    FetchDocumentRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: Public HTTP(S) URL of the document to fetch.
    FetchDocumentErrorResponse:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          enum: [false]
        error:
          type: string
          description: Human-readable error message.
        retryAfter:
          type: integer
          format: int32
          nullable: true
          description: Seconds until the next request is allowed (rate-limit responses only).
    ExtractResponse:
      type: object
      required: [markdown, metadata]
      properties:
        markdown:
          type: string
          description: The converted Markdown.
        metadata:
          type: object
          required: [extractionType, filename, fileType, sizeBytes]
          properties:
            extractionType:
              type: string
              enum:
                - powerpoint-notes
                - word-body
                - pdf-body
                - excel-tables
                - structured-data
                - epub-body
            filename:
              type: string
              description: The original filename as supplied by the caller.
            fileType:
              type: string
              enum:
                - powerpoint
                - word
                - pdf
                - excel
                - csv
                - epub
            sizeBytes:
              type: integer
              format: int32
              description: Size of the upload in bytes.
