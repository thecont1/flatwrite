name = "flatwrite-extract"
main = "src/index.js"
compatibility_date = "2026-06-24"

# IMPORTANT: The repo-root `wrangler.jsonc` declares
# `assets.directory = "public"`. When wrangler walks up to find a
# config, it merges that block in. This Worker is script-only and
# doesn't want to upload `public/` as static assets. The deploy.sh
# script handles this by passing `--assets ./src` on the wrangler
# CLI, which overrides the merged config. The empty `assets` block
# below is documentation — wrangler.toml cannot override the parent
# config's assets via TOML alone, so the script is required.

# Secrets (set via `wrangler secret put`):
#   API_KEY — public-facing key clients send in X-Api-Key. Separate from
#             the render worker's API_KEY so a leak in either surface
#             doesn't grant access to the other. NEVER commit the actual
#             value here. Must be set on BOTH environments:
#               wrangler secret put API_KEY --env production
#               wrangler secret put API_KEY --env staging

# IMPORTANT — environments and route inheritance (verified against
# wrangler 4.104 source, `normalizeAndValidateRoute`/`inheritable`):
# `route` IS inherited by named environments, and wrangler publishes
# inherited routes even when the environment sets `workers_dev = true`.
# If the production route stayed at the top level, deploying
# `--env staging` would reassign `extract.flatwrite.md/*` to the staging
# Worker and steal production traffic. The route therefore lives ONLY in
# [env.production], and deploy.sh always passes an explicit --env flag.
# Conversely, `vars` is NOT inherited by environments, so each env
# carries its own copy.
#
# Deploying without --env (plain `wrangler deploy`) now targets the
# top-level config, which has no route — a footgun that deploy.sh guards
# against by always passing --env. Do not deploy this worker manually
# without an environment.

[vars]
# Comma-separated list of extra CORS origins to trust. Production leaves
# this empty; the strict allowlist (https://flatwrite.md and
# https://*.flatwrite.md) is the only thing that matters. Local dev and
# CI can opt in to e.g. "http://127.0.0.1:8080,http://localhost:3000" so
# the worker accepts requests from a local editor without a real DNS
# hostname. Treat this like a secret — anyone in the list can call
# /mcp-token and /extract.
ALLOWED_DEV_ORIGINS = ""

# Workers Logs (free tier).
[observability]
enabled = true

# Production: the real worker name and the public route. The explicit
# `name` keeps the worker identical to the pre-environments deployment
# (without it wrangler would name it `flatwrite-extract-production`).
[env.production]
name = "flatwrite-extract"
route = { pattern = "extract.flatwrite.md/*", zone_name = "flatwrite.md" }

[env.production.vars]
ALLOWED_DEV_ORIGINS = ""

# Staging: workers.dev-only copy for CPU-time measurement and smoke
# testing. No route key anywhere above it, so nothing can be inherited —
# it is reachable only at https://flatwrite-extract-staging.<subdomain>.workers.dev
[env.staging]
name = "flatwrite-extract-staging"
workers_dev = true

[env.staging.vars]
ALLOWED_DEV_ORIGINS = ""
