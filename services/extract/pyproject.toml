[project]
name = "flatwrite-extract"
version = "0.1.0"
description = "AnyDoc-backed file extraction service for FlatWrite"
requires-python = ">=3.12"
dependencies = [
    "firecrawl-anydoc>=0.1.6",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pdf-inspector>=0.2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pillow>=10.0.0",   # for image EXIF in dev tests
]

[build-system]
requires = ["uv_build>=0.5.0", "hatchling"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "flatwrite_extract"
module-root = "src"

[tool.hatch.build.targets.wheel]
packages = ["src/flatwrite_extract"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pillow>=10.0.0",
]

[tool.pytest.ini_options]
testpaths = ["../../test/extract"]
